version: "3.8"

services:
  scl-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scl_backend_app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-https://scl-ai-service.onrender.com}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://smart-collaborative-library.vercel.app,http://localhost:5173}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    restart: unless-stopped