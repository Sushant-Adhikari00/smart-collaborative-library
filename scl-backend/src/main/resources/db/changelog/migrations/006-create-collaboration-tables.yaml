databaseChangeLog:
  - changeSet:
      id: 1-create-collaboration-groups-table
      author: antigravity
      changes:
        - createTable:
            tableName: collaboration_groups
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: invite_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: collaboration_groups
            baseColumnNames: owner_id
            constraintName: fk_collab_groups_owner
            referencedTableName: users
            referencedColumnNames: id

  - changeSet:
      id: 2-create-group-members-table
      author: antigravity
      changes:
        - createTable:
            tableName: group_members
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: group_role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: joined_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: group_members
            baseColumnNames: group_id
            constraintName: fk_group_members_group
            referencedTableName: collaboration_groups
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: group_members
            baseColumnNames: user_id
            constraintName: fk_group_members_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: group_members
            columnNames: group_id, user_id
            constraintName: uq_group_members_group_user

  - changeSet:
      id: 3-create-group-resources-table
      author: antigravity
      changes:
        - createTable:
            tableName: group_resources
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: uploader_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: file_url
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: file_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: file_size
                  type: BIGINT
              - column:
                  name: is_verified
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: is_pinned
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: ai_summary
                  type: TEXT
              - column:
                  name: ai_key_points
                  type: TEXT
              - column:
                  name: ai_keywords
                  type: TEXT
              - column:
                  name: uploaded_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: group_resources
            baseColumnNames: group_id
            constraintName: fk_group_resources_group
            referencedTableName: collaboration_groups
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: group_resources
            baseColumnNames: uploader_id
            constraintName: fk_group_resources_uploader
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 4-create-resource-comments-table
      author: antigravity
      changes:
        - createTable:
            tableName: resource_comments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: resource_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: parent_comment_id
                  type: BIGINT
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: resource_comments
            baseColumnNames: resource_id
            constraintName: fk_resource_comments_resource
            referencedTableName: group_resources
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: resource_comments
            baseColumnNames: author_id
            constraintName: fk_resource_comments_author
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: resource_comments
            baseColumnNames: parent_comment_id
            constraintName: fk_resource_comments_parent
            referencedTableName: resource_comments
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 5-create-teacher-announcements-table
      author: antigravity
      changes:
        - createTable:
            tableName: teacher_announcements
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: teacher_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: is_pinned
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: teacher_announcements
            baseColumnNames: group_id
            constraintName: fk_teacher_announcements_group
            referencedTableName: collaboration_groups
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: teacher_announcements
            baseColumnNames: teacher_id
            constraintName: fk_teacher_announcements_teacher
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 6-create-notifications-table
      author: antigravity
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: recipient_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: notification_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: target_url
                  type: VARCHAR(500)
              - column:
                  name: is_read
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: recipient_id
            constraintName: fk_notifications_recipient
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 7-add-group-id-to-chat-rooms
      author: antigravity
      changes:
        - addColumn:
            tableName: chat_rooms
            columns:
              - column:
                  name: group_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: chat_rooms
            baseColumnNames: group_id
            constraintName: fk_chat_rooms_group
            referencedTableName: collaboration_groups
            referencedColumnNames: id
            onDelete: CASCADE
