databaseChangeLog:
  - changeSet:
      id: 1-create-collaboration-requests-table
      author: antigravity
      changes:
        - createTable:
            tableName: collaboration_requests
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: requester_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: requester_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: requester_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: document_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: document_title
                  type: VARCHAR(255)
              - column:
                  name: owner_id
                  type: BIGINT
              - column:
                  name: owner_email
                  type: VARCHAR(255)
              - column:
                  name: message
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
