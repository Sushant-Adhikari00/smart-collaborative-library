databaseChangeLog:
  - changeSet:
      id: 002-create-document-table
      author: sudeep

      changes:
        - createTable:
            tableName: documents
            columns:

              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_documents
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(1000)

              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: file_url
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: file_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: file_size
                  type: BIGINT

              - column:
                  name: upload_date
                  type: TIMESTAMP

              - column:
                  name: uploaded_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: category_id
                  type: BIGINT

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: documents
            baseColumnNames: category_id
            referencedTableName: category
            referencedColumnNames: id
            constraintName: fk_documents_category