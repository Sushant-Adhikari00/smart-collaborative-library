server:
  port: 8080

app:
  upload:
    dir: uploads/documents

spring:
  application:
    name: scl-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none          # Liquibase owns the schema — Hibernate must not also create/alter tables
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml
    contexts: dev
    clear-checksums: true

supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_KEY}
  bucket: Porject_files

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}

jwt:
  # The secret key for signing JWTs. This should be a long, random string in production!
  secret: ${JWT_SECRET}
  accessTokenExpiration: 900000     # 15 mins (in milliseconds)
  refreshTokenExpiration: 604800000 # 7 days (in milliseconds)