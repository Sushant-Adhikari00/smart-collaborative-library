server:
  port: ${PORT:8080}
  tomcat:
    basedir: ./tomcat-temp


app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://*.vercel.app,https://smart-collaborative-library.vercel.app,http://localhost:5173,http://localhost:3000}


spring:
  application:
    name: scl-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none          # Liquibase owns the schema — Hibernate must not also create/alter tables
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml
    # contexts can be overridden via LIQUIBASE_CONTEXTS env var; empty = run all changesets
    clear-checksums: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:placeholder@gmail.com}
    password: ${MAIL_PASSWORD:placeholder}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

supabase:
  url: ${SUPABASE_URL:https://placeholder.supabase.co}
  key: ${SUPABASE_KEY:placeholder}
  bucket: Porject_files

ai-service:
  url: ${AI_SERVICE_URL:https://scl-ai-service.onrender.com}

jwt:
  # The secret key for signing JWTs. This should be a long, random string in production!
  secret: ${JWT_SECRET}
  accessTokenExpiration: 900000     # 15 mins (in milliseconds)
  refreshTokenExpiration: 604800000 # 7 days (in milliseconds)